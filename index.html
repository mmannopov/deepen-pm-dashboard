<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Deepen PM Dashboard</title><style>body{margin:0;font-family:Arial,sans-serif;background:#0b1020;color:#eef3ff}aside{position:fixed;width:220px;height:100vh;background:#080d18;padding:22px;box-sizing:border-box}main{margin-left:220px;padding:30px}button{display:block;width:100%;margin:6px 0;padding:11px;border:0;border-radius:8px;background:transparent;color:#9aa8c2;text-align:left;cursor:pointer}button:hover,button.active{background:#182238;color:white}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#121a2c;border:1px solid #27334d;border-radius:14px;padding:18px;margin-bottom:15px}.num{font-size:30px;font-weight:800;margin-top:8px}.muted{color:#91a0bd;font-size:12px}.two{grid-template-columns:1.3fr 1fr}.bar{height:9px;background:#293650;border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:#6ea8fe}.row{display:flex;justify-content:space-between;margin:12px 0;font-size:13px}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:10px;border-bottom:1px solid #27334d;text-align:left}th{color:#91a0bd}.tag{padding:4px 7px;border-radius:6px;background:#202b43}.risk{border-left:3px solid #ff6b7a;padding-left:12px}.good{border-left:3px solid #48d597;padding-left:12px}@media(max-width:800px){aside{position:static;width:100%;height:auto}main{margin:0}.grid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.grid{grid-template-columns:1fr}}</style></head><body><aside><h2>Deepen <span style='color:#6ea8fe'>PM Hub</span></h2><button class='active' onclick="show('overview',this)">◉ Overview</button><button onclick="show('erp',this)">▣ ERP</button><button onclick="show('well',this)">◈ Deepen Well</button><button onclick="show('team',this)">♙ Team</button><button onclick="show('risk',this)">⚠ Risks</button><button onclick="show('history',this)">◷ Sprint History</button><button onclick="show('tasks',this)">☷ Task Explorer</button><p class='muted' style='position:absolute;bottom:15px'>Primary / Parent Tasks only<br>Demo snapshot · 05 Oct 2026</p></aside><main><div style='display:flex;justify-content:space-between'><div><h1 id='title'>PM Overview</h1><p class='muted'>Deepen ERP & Deepen Well control center</p></div><span class='tag'>DEMO DATA</span></div><div id='app'></div></main><script>const ERP={total:17,s:{Backlog:3,'Design Handoff':8,'Code Review':2,'In Progress':2,'Ready for Dev':1,'In Design':1}};const WELL={total:69,s:{'Ready for Dev':12,'In QA':4,'To Do':13,Complete:7,'In Progress':10,'Ready for Release':3,'Ready for QA':2,'In Design':3,'Code Review':1,Backlog:14}};const tasks=[['Fit House - время абонементов','Backlog','Dilshod Asraev, Nematjon Narziev','ERP'],['Bug: Visit Qty','Backlog','Otabek, Dilshod Asraev','ERP'],['New White Label (Autopayment)','Design Handoff','Shaxob Sharipov','ERP'],['ERP: Notification UI part','Code Review','Ozodbek Abdisamatov','ERP'],['AUTO PAYMENT WHITELABEL FOR ALL AVAILABLE SUBSCRIPTION TYPES','In Progress','Dilshod Asraev','ERP'],['Fix titles in Timetable and Schedule views','Ready for Dev','Dilshod Asraev','ERP'],['Stress testing report','In QA','Bakhodur Abduvaliev, mukhtor','Deepen Well'],['Suggested people','To Do','masudbek, Muhammad Abduvaliyev','Deepen Well'],['AI trainer exercises library','In Progress','Sardorbek','Deepen Well'],['Family member health metric history','In Progress','Jushkin','Deepen Well'],['Writing new logic for global search','Ready for Release','Bakhodur','Deepen Well'],['Promocode page - for next release','Ready for QA','masudbek','Deepen Well'],['DeepenWell AntiCheat V2','In QA','Bakhodur, Muhammad','Deepen Well'],['corporate subscription plan','Complete','Muhammad','Deepen Well'],['Location missed problem in challenge','Ready for Dev','Muhammad','Deepen Well'],['Coros integration','Backlog','masudbek, Muhammad','Deepen Well'],['Notification for comments and likes','In Progress','Sardorbek','Deepen Well']];function bars(d){let t=Object.values(d.s).reduce((a,b)=>a+b,0);return Object.entries(d.s).map(([k,v])=>`<div class=row><span>${k}</span><b>${v}</b></div><div class=bar><i style='width:${v/t*100}%'></i></div>`).join('')}function overview(){app.innerHTML=`<div class='grid'><div class=card><div class=muted>Primary Tasks</div><div class=num>86</div></div><div class=card><div class=muted>Completed</div><div class=num>7</div></div><div class=card><div class=muted>In Progress</div><div class=num>12</div></div><div class=card><div class=muted>Backlog</div><div class=num>17</div></div></div><div class='grid two'><div class=card><h2>ERP Sprint 23</h2>${bars(ERP)}</div><div class=card><h2>Deepen Sprint 23</h2>${bars(WELL)}</div></div><div class='grid two'><div class=card><h2>Potential Bottlenecks</h2><div class=risk><b>ERP · Design Handoff</b><p class=muted>8/17 tasks. Queue signal only; confirm aging and downstream capacity.</p></div><div class=risk style='margin-top:15px'><b>Deepen · Backlog</b><p class=muted>14/69 tasks currently in Backlog.</p></div></div><div class=card><h2>PM Actions</h2><ol class=muted><li>Review ERP Design Handoff queue.</li><li>Review Deepen Backlog and To Do.</li><li>Track Code Review → QA flow.</li><li>Use parent task status as Sprint KPI.</li></ol></div></div>`}function sprint(d,name){app.innerHTML=`<div class=card><h2>${name}</h2><div class=num>${d.total}</div><div class=muted>Primary Tasks</div>${bars(d)}</div><div class=card><h2>Status Distribution</h2><table><tr><th>Status</th><th>Tasks</th></tr>${Object.entries(d.s).map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}</table></div>`}function team(){let m={};tasks.forEach(t=>{t[2].split(', ').forEach(n=>m[n]=(m[n]||0)+1)});app.innerHTML=`<div class=card><h2>Team Workload</h2><p class=muted>Visible seeded tasks only; this is workload, not performance scoring.</p><table><tr><th>Member</th><th>Assigned visible tasks</th></tr>${Object.entries(m).sort((a,b)=>b[1]-a[1]).map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}</table></div>`}function risk(){app.innerHTML=`<div class=card><h2>Bottlenecks & Risks</h2><div class=risk><b>ERP Design Handoff</b><p class=muted>8 primary tasks. Potential queue risk; no time-in-status data in this snapshot.</p></div><div class=risk style='margin-top:15px'><b>Deepen Backlog</b><p class=muted>14 primary tasks. Review whether these are intentionally deferred.</p></div><div class=good style='margin-top:15px'><b>Methodology</b><p class=muted>Subtasks are excluded. 1 parent task = 1 Sprint task.</p></div></div>`}function history(){app.innerHTML=`<div class=card><h2>Sprint History</h2><table><tr><th>Sprint</th><th>Current Primary Tasks</th><th>Current Complete</th></tr><tr><td>ERP 21</td><td>8</td><td>8</td></tr><tr><td>ERP 22</td><td>4</td><td>4</td></tr><tr><td>ERP 23</td><td>17</td><td>0</td></tr><tr><td>Deepen 22</td><td>14</td><td>14</td></tr><tr><td>Deepen 23</td><td>69</td><td>7</td></tr></table><p class=muted>Historical rows reflect current list state, not necessarily original sprint scope.</p></div>`}function tasksView(){app.innerHTML=`<div class=card><h2>Task Explorer</h2><input id=q placeholder='Search tasks...' oninput='filter()' style='padding:10px;background:#0e1627;border:1px solid #27334d;color:white;border-radius:8px;width:60%'><table id=tbl><tr><th>Task</th><th>Status</th><th>Assignee</th><th>Product</th></tr>${tasks.map(t=>`<tr><td>${t[0]}</td><td><span class=tag>${t[1]}</span></td><td>${t[2]}</td><td>${t[3]}</td></tr>`).join('')}</table></div>`}function filter(){let q=document.getElementById('q').value.toLowerCase();[...document.querySelectorAll('#tbl tr')].slice(1).forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}function show(p,b){document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');title.innerText={overview:'PM Overview',erp:'ERP',well:'Deepen Well',team:'Team',risk:'Bottlenecks & Risks',history:'Sprint History',tasks:'Task Explorer'}[p];p==='overview'?overview():p==='erp'?sprint(ERP,'ERP Sprint 23'):p==='well'?sprint(WELL,'Deepen Sprint 23'):p==='team'?team():p==='risk'?risk():p==='history'?history():tasksView()}overview();</script></body></html>
